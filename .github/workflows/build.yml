name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*', 'release-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop-app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # afterPack 用 rcedit 写入 exe 图标/版本信息；CI 干净环境没有缓存，下载失败也不阻塞构建
      - name: Prepare rcedit (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'rcedit-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/electron/rcedit/releases/latest/download/rcedit-x64.exe' -OutFile $dest
          "RCEDIT_EXE=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build & package (Windows)
        run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List release files
        run: Get-ChildItem release | Select-Object Name,Length

      # 普通 push：产物上传到 Actions Artifacts，可在运行详情页下载
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: BossClaw-Windows-${{ github.ref_name }}-${{ github.sha }}
          path: |
            desktop-app/release/*.exe
            desktop-app/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

      # 打 v* / release-* 标签：创建/更新 GitHub Release，并上传安装包与 blockmap
      - name: Upload to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: BossClaw ${{ github.ref_name }}
          files: |
            desktop-app/release/*.exe
            desktop-app/release/*.blockmap
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
